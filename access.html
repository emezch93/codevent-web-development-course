<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Access | CodeVent Digital</title>
<meta name="description" content="Activating your CodeVent Digital Web Development Course access.">
<link rel="icon" type="image/png" href="codevent-logo.PNG">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #f5f7fa;
  color: #111827;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: 100%;
  max-width: 480px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
  text-align: center;
}

.brand {
  margin-bottom: 20px;
}

.brand-name {
  font-size: 18px;
  font-weight: 700;
}

.label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #6b7280;
}

h1 {
  margin: 8px 0 20px;
  font-size: 26px;
}

.spinner {
  width: 28px;
  height: 28px;
  margin: 4px auto 20px;
  border-radius: 50%;
  border: 3px solid #e5e7eb;
  border-top-color: #111827;
  animation: spin 0.8s linear infinite;
}
.spinner.hidden { display: none; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

.status {
  padding: 14px;
  border-radius: 10px;
  background: #f3f4f6;
  color: #374151;
  font-size: 14px;
  line-height: 1.5;
}

.status.success {
  background: #ecfdf5;
  color: #065f46;
}

.status.error {
  background: #fef2f2;
  color: #991b1b;
}

.course-link, .copy-token {
  display: none;
  width: 100%;
  align-items: center;
  justify-content: center;
  padding: 13px 16px;
  border: 0;
  border-radius: 9px;
  background: #111827;
  color: #ffffff;
  font-weight: 600;
  text-decoration: none;
  margin-top: 16px;
  cursor: pointer;
  font: inherit;
}

.course-link.visible, .copy-token.visible, .token-panel.visible {
  display: flex;
}

.copy-token { background: #e5e7eb; color: #111827; }
.token-panel {
  display: none;
  flex-direction: column;
  gap: 8px;
  margin-top: 18px;
  text-align: left;
}
.token-panel label { font-size: 13px; font-weight: 700; }
.token-value {
  margin: 0;
  padding: 12px;
  overflow-wrap: anywhere;
  border: 1px solid #e5e7eb;
  border-radius: 9px;
  background: #f9fafb;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
}

</style>

</head>

<body>

<main class="container">

  <div class="brand">
    <span class="brand-name">CodeVent Digital</span>
  </div>

  <div class="label">Course Access</div>
  <h1>Web Development</h1>

  <div id="spinner" class="spinner"></div>

  <div id="status" class="status">Checking payment...</div>

  <div id="tokenPanel" class="token-panel">
    <label for="tokenValue">Your Course Access Token</label>
    <p id="tokenValue" class="token-value"></p>
  </div>

  <button id="copyToken" class="copy-token" type="button">Copy Token</button>

  <a id="courseLink" class="course-link" href="https://emezch93.github.io/codevent-web-development-course/" target="_self">
    Continue to Course
  </a>

</main>

<script>

const WORKER_URL =
  "https://codevent-web-development-course.emezch93.workers.dev";

const COURSE_URL =
  "https://emezch93.github.io/codevent-web-development-course/";

const ACCESS_TOKEN_KEY =
  "codevent_webdev_access_token";

const statusElement = document.getElementById("status");
const spinnerElement = document.getElementById("spinner");
const courseLinkElement = document.getElementById("courseLink");
const tokenPanelElement = document.getElementById("tokenPanel");
const tokenValueElement = document.getElementById("tokenValue");
const copyTokenElement = document.getElementById("copyToken");
let accessToken = "";

function setStatus(message, type = "") {
  statusElement.textContent = message;
  statusElement.className = "status";
  if (type) {
    statusElement.classList.add(type);
  }
}

function stopSpinner() {
  spinnerElement.classList.add("hidden");
}

function showCourseLink() {
  courseLinkElement.classList.add("visible");
}

function showToken(token) {
  accessToken = token;
  tokenValueElement.textContent = token;
  tokenPanelElement.classList.add("visible");
  copyTokenElement.classList.add("visible");
}

async function copyToken() {
  try {
    await navigator.clipboard.writeText(accessToken);
    copyTokenElement.textContent = "Token Copied";
  } catch (error) {
    copyTokenElement.textContent = "Copy failed — select the token above";
  }
}

async function verifyPayment() {
  const params = new URLSearchParams(window.location.search);
  const reference = params.get("reference");

  if (!reference) {
    stopSpinner();
    setStatus(
      "No payment reference was found. If you already completed payment, check your confirmation email, or return to the payment page to try again.",
      "error"
    );
    return;
  }

  setStatus("Verifying your payment...");

  let response;
  try {
    response = await fetch(
      WORKER_URL + "/verify-payment?reference=" + encodeURIComponent(reference),
      {
        method: "GET",
        headers: { "Accept": "application/json" },
        cache: "no-store"
      }
    );
  } catch (error) {
    stopSpinner();
    setStatus("Unable to reach the verification service. Please check your connection and reload this page.", "error");
    return;
  }

  let data;
  try {
    data = await response.json();
  } catch (error) {
    stopSpinner();
    setStatus("Received an unexpected response while verifying payment. Please reload this page.", "error");
    return;
  }

  if (!response.ok || data.authorized !== true || typeof data.token !== "string" || !data.token) {
    stopSpinner();
    setStatus(data.message || "Payment could not be verified.", "error");
    return;
  }

  stopSpinner();
  setStatus("Payment verified. Your token has been saved on this browser; you can also copy it before continuing to the course.", "success");
  showToken(data.token);
  localStorage.setItem(ACCESS_TOKEN_KEY, data.token);
  showCourseLink();
}

copyTokenElement.addEventListener("click", copyToken);
verifyPayment();

</script>

</body>
</html>
